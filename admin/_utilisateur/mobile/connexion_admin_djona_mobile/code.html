<img alt="Djona Logo" class="w-20 h-20 rounded-full shadow-sm mb-gutter object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5jMUATKKgQR9T-VhRmoXG5Wjyz1W326Akaf8SJWyivyb-xeCY8QCofrBz68gBUD_JU98gK96vXjlyS5GsiDSh57N7IGxbDGWyJ6P6TZ-xpezVpaFHncb-2gZkX2bPXDu3lSbIB-LDWamnMP_Jw0ylwY92DYR7AleEdhxrP_xtVuQAih8NI17PSljCjVRls5IVI_bPlf13v61bpmwJAC6-bdoV9zOenrU_D1dWX0FRIP_NQ2ffrxqAErvhulJbZwII7w"/>

<div class="flex items-center text-label-md text-secondary-container mt-1 bg-secondary-container/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-base mr-1" style="font-variation-settings: 'FILL' 1;">lock</span>

</div>
<form class="flex flex-col space-y-gutter">
<div class="flex flex-col space-y-1">
<label class="font-label-md text-on-surface" for="email">Adresse email administrateur</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container rounded-lg text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" id="email" placeholder="admin@djona.ci" type="email"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="font-label-md text-on-surface flex justify-between" for="password">
                        Mot de passe
                        <a class="text-primary hover:underline font-label-sm" href="#">Oublié ?</a>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">key</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container rounded-lg text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary" id="toggle-pwd" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="w-4 h-4 rounded text-primary focus:ring-primary bg-surface-container border-none" id="remember" type="checkbox"/>
<label class="ml-2 text-label-sm text-on-surface-variant" for="remember">Se souvenir de moi sur cet appareil</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-md py-4 rounded-lg flex items-center justify-center shadow-md hover:bg-on-primary-fixed transition-colors mt-2" type="button">
                    Se connecter

</form>

<p class="text-[10px] text-on-surface-variant text-center uppercase tracking-wider leading-tight">

                </p>
</div>
</div>

<div class="relative z-10 pb-gutter flex justify-center w-full">

<span class="text-label-sm text-on-primary-container tracking-wider font-semibold">ENVIRONNEMENT DE PRODUCTION</span>
</div>
</div>
</div>
<script>
    document.getElementById('toggle-pwd').addEventListener('click', function() {
        const pwdInput = document.getElementById('password');
        const icon = this.querySelector('span');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            pwdInput.type = 'password';
            icon.textContent = 'visibility';
        }
    });
</script></main></body></html>
