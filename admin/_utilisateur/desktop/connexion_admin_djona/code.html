<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head><body class="bg-background font-body-md text-on-background"><main class="w-full bg-background"><div class="flex flex-col w-full h-full min-h-[calc(100vh-80px)] relative overflow-hidden bg-background">
<!-- Geometric Background Pattern (SVG) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]">
<svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="100" id="admin-pattern" patternUnits="userSpaceOnUse" width="100" x="0" y="0">
<path class="text-on-background" d="M0 100L100 0M50 150L150 50M-50 50L50 -50" fill="none" stroke="currentColor" stroke-width="0.5"></path>
<circle class="text-on-background" cx="50" cy="50" fill="currentColor" r="1.5"></circle>
<circle class="text-on-background" cx="0" cy="100" fill="currentColor" r="1.5"></circle>
<circle class="text-on-background" cx="100" cy="0" fill="currentColor" r="1.5"></circle>
</pattern>
<linearGradient id="fade" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="transparent"></stop>
<stop class="text-background" offset="50%" stop-color="currentColor"></stop>
<stop offset="100%" stop-color="transparent"></stop>
</linearGradient>
</defs>
<rect fill="url(#admin-pattern)" height="100%" width="100%"></rect>
<rect class="opacity-80" fill="url(#fade)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Decorative Gradient Blobs -->
<div class="absolute top-1/4 left-1/4 w-[40vw] h-[40vw] max-w-[600px] max-h-[600px] bg-primary-fixed/20 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 pointer-events-none mix-blend-multiply"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30vw] h-[30vw] max-w-[400px] max-h-[400px] bg-secondary-fixed/20 rounded-full blur-[80px] translate-x-1/2 translate-y-1/2 pointer-events-none mix-blend-multiply"></div>
<div class="relative z-10 flex flex-col items-center justify-center flex-grow p-container-margin-mobile md:p-container-margin-desktop">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-2xl shadow-[0_8px_32px_rgba(26,82,118,0.12)] relative overflow-hidden group">
<!-- Top Accent Line -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary via-primary-container to-secondary"></div>
<div class="p-8 md:p-10 flex flex-col gap-8">
<!-- Logo & Header -->
<div class="flex flex-col items-center gap-4 text-center">
<img alt="Djona Admin Logo" class="h-16 w-16 object-contain rounded-xl bg-surface-container-low p-2 shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCF50Blcw5cAwZpdMZaA2F7SPtY8JuWinoZnm817H7Zwn8BVzwH-31ca6CMg1HHSTHbYGbjRiCUahZOxEcpdTvQi_5nmMU1qTPtWE4meym3ZPKdgNm7TxQ0X6UjZjoBmRqEfTcY8mYAoLEe3xZxXW7hyE7XBeRx2mItAKqTNrXeSZsECwVoDanDqSYyUmn68gxt3n8jXo1nHI4F0r4-dv2EyMYlnuO8etuNKcTjJiHQSwTUmO8BpnJqOx1s7AQwP1LNqg">
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Portail Admin</h1>
<div class="flex items-center justify-center gap-1.5 text-secondary">
<span class="material-symbols-outlined text-[16px] font-bold" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Connexion Sécurisée</span>
</div>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5" id="admin-login-form">
<div class="flex flex-col gap-4">
<!-- Email Input -->
<div class="relative flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant sr-only" for="admin-email">Adresse Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#003b5a]">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant/70 text-[20px] pointer-events-none">mail</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none rounded-lg" id="admin-email" placeholder="Adresse email administrateur" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="relative flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant sr-only" for="admin-password">Mot de passe</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#003b5a]">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant/70 text-[20px] pointer-events-none">key</span>
<input class="w-full pl-11 pr-12 py-3.5 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none rounded-lg" id="admin-password" placeholder="Mot de passe" required="" type="password">
<button class="absolute right-3.5 text-on-surface-variant/70 hover:text-primary transition-colors flex items-center justify-center w-6 h-6" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-6 mt-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="relative flex items-center justify-center w-4 h-4">
<input class="peer appearance-none w-4 h-4 rounded-sm bg-surface-container-low checked:bg-primary transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary/20 focus:ring-offset-1" id="remember-me" type="checkbox">
<span class="material-symbols-outlined absolute text-on-primary text-[14px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer select-none" for="remember-me">Se souvenir de moi</label>
</div>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline underline-offset-4" href="#">Mot de passe oublié ?</a>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-[16px] py-3.5 rounded-lg transition-all shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest flex items-center justify-center gap-2 group/btn" type="submit">
<span class="">Se connecter</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover/btn:translate-x-1">arrow_forward</span>
</button>
</div>
</form>
<!-- Disclaimer -->
<div class="mt-2 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-label-sm text-[11px] leading-relaxed text-on-surface-variant/60 uppercase tracking-wide">
                        Accès restreint au personnel autorisé de Djona Automotive. Toute tentative de connexion non autorisée est surveillée.
                    </p>
</div>
</div>
</div>
<!-- Environment Indicator -->
<div class="mt-8 px-4 py-2 bg-error-container/50 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-sm text-[11px] text-on-error-container font-bold tracking-wider uppercase">Environnement de Production</span>
</div>
</div>
</div>
<script>
    // Password visibility toggle
    document.getElementById('toggle-password').addEventListener('click', function() {
        const passwordInput = document.getElementById('admin-password');
        const icon = document.getElementById('visibility-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility_off';
        }
    });

    // Simple form submission animation
    document.getElementById('admin-login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        
        // Loading state
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Authentification...</span>';
        btn.disabled = true;
        btn.classList.add('opacity-80', 'cursor-not-allowed');

        // Simulate network request
        setTimeout(() => {
            // Reset for demo purposes
            btn.innerHTML = originalContent;
            btn.disabled = false;
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
            
            // Add error shake effect for demo
            const formContainer = this.closest('.bg-surface-container-lowest');
            formContainer.style.transform = 'translateX(-5px)';
            setTimeout(() => formContainer.style.transform = 'translateX(5px)', 100);
            setTimeout(() => formContainer.style.transform = 'translateX(-5px)', 200);
            setTimeout(() => formContainer.style.transform = 'translateX(0)', 300);
        }, 1500);
    });
</script></main>

</body></html>
