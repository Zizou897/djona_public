<div aria-labelledby="modal-confirmation-titre" aria-modal="true" class="fixed inset-0 z-[110] hidden items-center justify-center bg-on-surface/40 backdrop-blur-sm px-4" id="modal-confirmation" role="dialog">
    <div class="bg-surface-container-lowest rounded-2xl shadow-xl max-w-sm w-full p-6 flex flex-col items-center text-center gap-4">
        <span class="w-14 h-14 rounded-full bg-error/10 flex items-center justify-center" id="modal-confirmation-pastille">
            <span class="material-symbols-outlined text-error text-[28px]" id="modal-confirmation-icone">delete</span>
        </span>
        <div>
            <h3 class="font-headline-md font-semibold text-lg text-on-surface" id="modal-confirmation-titre"></h3>
            <p class="text-sm text-on-surface-variant mt-1" id="modal-confirmation-message"></p>
        </div>
        <form action="" class="flex gap-3 w-full" id="modal-confirmation-form" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <button class="flex-1 px-4 py-2.5 rounded-lg border border-outline-variant text-on-surface-variant text-sm font-semibold hover:bg-surface-container transition-colors" onclick="fermerModalConfirmation()" type="button">Annuler</button>
            <button class="flex-1 px-4 py-2.5 rounded-lg bg-error text-white text-sm font-semibold hover:bg-error/90 transition-colors" id="modal-confirmation-bouton" type="submit">Confirmer</button>
        </form>
    </div>
</div>
<script>
    // ton : 'danger' (défaut, rouge) pour les actions destructives, 'primaire' pour les validations.
    function ouvrirModalConfirmation(url, titre, message, texteBouton, icone, ton) {
        var primaire = ton === 'primaire';
        document.getElementById('modal-confirmation-form').action = url;
        document.getElementById('modal-confirmation-titre').textContent = titre;
        document.getElementById('modal-confirmation-message').textContent = message;
        var bouton = document.getElementById('modal-confirmation-bouton');
        bouton.textContent = texteBouton || 'Confirmer';
        bouton.className = 'flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors ' +
            (primaire ? 'bg-primary text-on-primary hover:bg-primary-container' : 'bg-error text-white hover:bg-error/90');
        var icon = document.getElementById('modal-confirmation-icone');
        icon.textContent = icone || 'delete';
        icon.className = 'material-symbols-outlined text-[28px] ' + (primaire ? 'text-primary' : 'text-error');
        document.getElementById('modal-confirmation-pastille').className =
            'w-14 h-14 rounded-full flex items-center justify-center ' + (primaire ? 'bg-primary/10' : 'bg-error/10');
        var modal = document.getElementById('modal-confirmation');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        modal.querySelector('button[type="button"]').focus();
    }
    function fermerModalConfirmation() {
        var modal = document.getElementById('modal-confirmation');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { fermerModalConfirmation(); } });
    document.getElementById('modal-confirmation').addEventListener('click', function (e) {
        if (e.target === this) { fermerModalConfirmation(); }
    });
</script>
