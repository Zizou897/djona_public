{# Partial : bouton "Comparer" — cible HTMX, mis à jour par toggle_compare #}
{% if in_compare %}
<button
  id="compare-btn-{{ vehicle.id }}"
  hx-post="{% url 'catalog:toggle_compare' vehicle.id %}"
  hx-target="#compare-btn-{{ vehicle.id }}"
  hx-swap="outerHTML"
  title="Retirer de la comparaison"
  class="group inline-flex items-center gap-1.5 px-3 py-2 rounded border-2 border-secondary bg-secondary/10 text-secondary font-label-md text-label-md hover:bg-secondary hover:text-on-secondary active:scale-95 transition-all"
  aria-label="Retirer {{ vehicle.brand }} {{ vehicle.model_name }} de la comparaison"
  aria-pressed="true">
  <span class="material-symbols-outlined text-[18px]" aria-hidden="true">compare_arrows</span>
  <span class="hidden sm:inline">Comparé</span>
</button>
{% else %}
<button
  id="compare-btn-{{ vehicle.id }}"
  hx-post="{% url 'catalog:toggle_compare' vehicle.id %}"
  hx-target="#compare-btn-{{ vehicle.id }}"
  hx-swap="outerHTML"
  {% if compare_count >= max_compare %}disabled title="Comparateur plein ({{ max_compare }} véhicules max)"{% else %}title="Ajouter à la comparaison"{% endif %}
  class="group inline-flex items-center gap-1.5 px-3 py-2 rounded border border-outline/40 text-on-surface-variant font-label-md text-label-md hover:border-secondary hover:text-secondary active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
  aria-label="Ajouter {{ vehicle.brand }} {{ vehicle.model_name }} à la comparaison"
  aria-pressed="false">
  <span class="material-symbols-outlined text-[18px]" aria-hidden="true">compare_arrows</span>
  <span class="hidden sm:inline">Comparer</span>
</button>
{% endif %}
