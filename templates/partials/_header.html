{% load static %}

    <a href="{% url 'core:home' %}" class="flex items-center gap-base">
      <img src="{% static 'img/djona-logo.png' %}" alt="Djona" class="h-8 w-auto object-contain">
      <span class="font-headline-md text-headline-md text-primary">Djona</span>
    </a>

    <nav class="hidden lg:flex items-center gap-gutter" aria-label="Navigation principale">
      <a href="{% url 'core:home' %}"

    </nav>

    <div class="flex items-center gap-base">
      <a href="#"
         class="hidden md:inline-flex px-4 py-2 border border-primary text-primary font-label-md text-label-md rounded-lg hover:bg-primary-fixed transition-colors">
        Publier mon véhicule

      <button type="button"
              class="flex items-center gap-2 bg-secondary text-on-secondary px-6 py-2.5 rounded-lg font-label-md text-label-md shadow-md hover:brightness-110 transition-all">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">search</span>
        Rechercher
      </button>
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-2" aria-hidden="true">
