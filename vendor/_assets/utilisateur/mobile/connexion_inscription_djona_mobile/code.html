<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
      Sécurisé par Djona Technologies
    </p>

<script>
    function switchAuthMode(mode) {
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');

      if (mode === 'login') {
        // Update Tabs
        loginTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        loginTab.classList.remove('text-on-surface-variant');
        signupTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        signupTab.classList.add('text-on-surface-variant');

        // Toggle Forms
        signupForm.classList.add('opacity-0', 'scale-95');
        setTimeout(() => {
          signupForm.classList.add('hidden');
          loginForm.classList.remove('hidden');
          setTimeout(() => {
            loginForm.classList.remove('opacity-0', 'scale-95');
            loginForm.classList.add('opacity-100', 'scale-100');
          }, 50);
        }, 200);

      } else {
        // Update Tabs
        signupTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        signupTab.classList.remove('text-on-surface-variant');
        loginTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        loginTab.classList.add('text-on-surface-variant');

        // Toggle Forms
        loginForm.classList.add('opacity-0', 'scale-95');
        setTimeout(() => {
          loginForm.classList.add('hidden');
          signupForm.classList.remove('hidden');
          setTimeout(() => {
            signupForm.classList.remove('opacity-0', 'scale-95');
            signupForm.classList.add('opacity-100', 'scale-100');
          }, 50);
        }, 200);
      }
    }

    // Micro-interaction: Input focus effect
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.parentElement.classList.add('translate-y-[-2px]');
      });
      input.addEventListener('blur', () => {
        input.parentElement.parentElement.classList.remove('translate-y-[-2px]');
      });
    });
  </script>
