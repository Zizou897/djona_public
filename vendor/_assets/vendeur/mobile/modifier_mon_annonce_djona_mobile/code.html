<script>
    function switchTab(tabName) {
      const tabs = ['basic', 'photos', 'details'];
      const sections = ['section-basic', 'section-photos', 'section-details'];
      
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tabName) {
          btn.classList.add('border-primary', 'text-primary');
          btn.classList.remove('border-transparent', 'text-on-surface-variant');
        } else {
          btn.classList.remove('border-primary', 'text-primary');
          btn.classList.add('border-transparent', 'text-on-surface-variant');
        }
      });

      sections.forEach(s => {
        const section = document.getElementById(s);
        if (s === `section-${tabName}`) {
          section.classList.remove('hidden');
          section.classList.add('block', 'animate-in', 'fade-in', 'duration-300');
        } else {
          section.classList.add('hidden');
          section.classList.remove('block');
        }
      });
      
      // Feedback haptic simulation
      if (window.navigator.vibrate) {
        window.navigator.vibrate(5);
      }
    }

    // Input formatting for price
    const priceInput = document.querySelector('input[value="38,500,000"]');
    priceInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value) {
        e.target.value = new Intl.NumberFormat('fr-FR').format(value);
      }
    });

    // Simple interaction for checkboxes
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
      checkbox.addEventListener('change', (e) => {
        const container = e.target.closest('label');
        if (e.target.checked) {
          container.classList.add('bg-primary/5', 'border-primary/20');
        } else {
          container.classList.remove('bg-primary/5', 'border-primary/20');
        }
      });
      // Initial state
      if (checkbox.checked) checkbox.closest('label').classList.add('bg-primary/5', 'border-primary/20');
    });
  </script>
