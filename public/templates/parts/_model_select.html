{% comment %}
Liste des modèles de la marque choisie. `oob` = renvoyée avec les résultats HTMX pour
remplacer la liste de la page (la marque a pu changer) sans recharger les filtres.
{% endcomment %}
<select id="parts-model-filters" name="modele" aria-label="Modèle" {% if oob %}hx-swap-oob="true"{% endif %}
        class="w-full bg-white border border-outline-variant rounded px-4 py-2.5 font-body-md text-label-md outline-none focus:ring-2 focus:ring-primary transition-shadow">
  {% include 'parts/_model_options.html' %}
</select>
