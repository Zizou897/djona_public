<div class="flex flex-col gap-2 {{ extra_class }}">
  <label for="{{ field.id_for_label }}" class="font-label-md text-label-md text-on-surface">{{ field.label }}{% if field.field.required %} <span class="text-error" aria-hidden="true">*</span>{% endif %}</label>
  <div class="relative">
    {{ field }}
    {% if is_select %}<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none opacity-50" aria-hidden="true">keyboard_arrow_down</span>{% endif %}
  </div>
  {% for error in field.errors %}<p class="text-sm text-error" role="alert">{{ error }}</p>{% endfor %}
</div>
